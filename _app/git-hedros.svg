<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18202A"/>
      <stop offset="100%" stop-color="#0E141B"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#FF5E13" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <clipPath id="squircle">
      <rect x="24" y="24" width="464" height="464" rx="100" />
    </clipPath>
  </defs>

  <!-- Card Background -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#bgGrad)"/>
  <rect x="24" y="24" width="464" height="464" rx="100" fill="none" stroke="url(#borderGrad)" stroke-width="8"/>

  <!-- Split Color Halves inside Card -->
  <g clip-path="url(#squircle)">
    <!-- Left Half: Cobalt Blue with glow -->
    <path d="M24 24 H256 V488 H24 Z" fill="#0077D4" fill-opacity="0.22"/>
    <circle cx="200" cy="200" r="160" fill="#0077D4" fill-opacity="0.35" filter="url(#glow)"/>
    
    <!-- Right Half: Vibrant Orange with glow -->
    <path d="M256 24 H488 V488 H256 Z" fill="#FF5E13" fill-opacity="0.22"/>
    <circle cx="312" cy="312" r="160" fill="#FF5E13" fill-opacity="0.35" filter="url(#glow)"/>

    <!-- Center dividing subtle line -->
    <line x1="256" y1="24" x2="256" y2="488" stroke="#ffffff" stroke-opacity="0.15" stroke-width="2"/>
  </g>

  <!-- The "H" Emblem (Hedros Bold Modern Style) -->
  <g filter="url(#glow)">
    <!-- Left Stem (Blue Tint Glow) -->
    <rect x="136" y="128" width="56" height="256" rx="20" fill="#FFFFFF"/>
    <!-- Right Stem (Orange Tint Glow) -->
    <rect x="320" y="128" width="56" height="256" rx="20" fill="#FFFFFF"/>
    <!-- Crossbar -->
    <rect x="136" y="228" width="240" height="56" rx="18" fill="#FFFFFF"/>
  </g>

  <!-- Inner Split Color Accent on Crossbar -->
  <rect x="180" y="238" width="76" height="36" rx="8" fill="#0077D4" fill-opacity="0.8"/>
  <rect x="256" y="238" width="76" height="36" rx="8" fill="#FF5E13" fill-opacity="0.8"/>
</svg>
